<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600mm" height="400mm" viewBox="0 0 600 400">
  <!-- plate 200 x 120 with a round hole -->
  <path d="M20 20 H220 V140 H20 Z M145 80 A25 25 0 1 0 195 80 A25 25 0 1 0 145 80 Z" fill="#000" fill-rule="evenodd"/>
  <!-- blue line inside the plate: a score mark -->
  <line x1="40" y1="60" x2="120" y2="60" stroke="#0000ff" stroke-width="0.5"/>
  <!-- ring "O" and an island disc in its hole -->
  <path d="M270 90 A60 60 0 1 0 390 90 A60 60 0 1 0 270 90 Z M290 90 A40 40 0 1 0 370 90 A40 40 0 1 0 290 90 Z" fill="#000" fill-rule="evenodd"/>
  <circle cx="330" cy="90" r="20" fill="#000"/>
  <!-- star, placed with a transform -->
  <g transform="translate(500 90) rotate(15)">
    <polygon points="0.000,-60.000 14.695,-20.225 57.063,-18.541 23.776,7.725 35.267,48.541 0.000,25.000 -35.267,48.541 -23.776,7.725 -57.063,-18.541 -14.695,-20.225" fill="#000"/>
  </g>
  <!-- rounded rectangle -->
  <rect x="250" y="200" width="160" height="90" rx="15" ry="15" fill="#000"/>
  <!-- bezier blob -->
  <path d="M60 230 C 90 180, 170 190, 180 240 C 190 290, 150 330, 110 320 C 60 310, 30 280, 60 230 Z" fill="#000"/>
</svg>
