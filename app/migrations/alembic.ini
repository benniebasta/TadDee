# Only for writing new migrations by hand; the app migrates itself at start.
#   alembic -c app/migrations/alembic.ini revision -m "add feeds table" --rev-id 0003
# Run it from the repo root. Database: NEST_DATA_DIR/nest.db (default ./data/nest.db).
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../..
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
